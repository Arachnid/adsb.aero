repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^server/tests/fixtures/traces/
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^server/tests/fixtures/traces/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^server/tests/fixtures/traces/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^server/
      - id: ruff-format
        files: ^server/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^server/adsb_server/
        args: ["--strict", "--config-file=server/pyproject.toml"]
        additional_dependencies:
          - "pydantic>=2.9"
          - "fastapi>=0.115"
          - "pydantic-settings>=2.0"
          - "scalar-fastapi>=1.0"
          - "httpx>=0.28"
          - "orjson>=3.10"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^web/
        types_or: [ts, tsx, javascript, jsx, json, yaml, css]

  - repo: local
    hooks:
      - id: web-eslint
        name: Web ESLint
        entry: bash -c 'cd web && pnpm eslint src'
        language: system
        pass_filenames: false
        files: ^web/src/

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.3.0
    hooks:
      - id: sqlfluff-lint
        files: \.sql$
      - id: sqlfluff-fix
        files: \.sql$

  - repo: local
    hooks:
      - id: server-tests
        name: Server tests (coverage)
        entry: bash -c 'cd server && .venv/bin/pytest'
        language: system
        pass_filenames: false
        files: ^server/

      - id: web-typecheck
        name: Web TypeScript type check
        entry: bash -c 'cd web && pnpm tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^web/

      - id: web-tests
        name: Web tests (coverage)
        entry: bash -c 'cd web && pnpm test --coverage --run'
        language: system
        pass_filenames: false
        files: ^web/
