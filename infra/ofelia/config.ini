[job-run "import-traces-startup"]
schedule    = @startup
image       = adsb-api:latest
network     = infra_db
environment = ["POSTGRES_HOST=postgres", "POSTGRES_PORT=5432", "POSTGRES_DB=adsb", "POSTGRES_USER=adsb", "SCHEDULER_CACHE_DIR=/data/cache", "SCHEDULER_LOOKBACK_DAYS=0", "SCHEDULER_KEEP_TRACES=false"]
volume      = ["infra_scheduler_cache:/data/cache"]
command     = python -m adsb_server.ingestion.scheduler_main

[job-run "import-traces"]
schedule    = @every 12h
image       = adsb-api:latest
network     = infra_db
no-overlap  = true
environment = ["POSTGRES_HOST=postgres", "POSTGRES_PORT=5432", "POSTGRES_DB=adsb", "POSTGRES_USER=adsb", "SCHEDULER_CACHE_DIR=/data/cache", "SCHEDULER_LOOKBACK_DAYS=0", "SCHEDULER_KEEP_TRACES=false"]
volume      = ["infra_scheduler_cache:/data/cache"]
command     = python -m adsb_server.ingestion.scheduler_main

[job-run "import-airframes-startup"]
schedule    = @startup
image       = adsb-api:latest
network     = infra_db
environment = ["POSTGRES_HOST=postgres", "POSTGRES_PORT=5432", "POSTGRES_DB=adsb", "POSTGRES_USER=adsb"]
command     = python -m adsb_server.reference_data.airframes

[job-run "import-airframes"]
schedule    = 0 3 * * 0
image       = adsb-api:latest
network     = infra_db
no-overlap  = true
environment = ["POSTGRES_HOST=postgres", "POSTGRES_PORT=5432", "POSTGRES_DB=adsb", "POSTGRES_USER=adsb"]
command     = python -m adsb_server.reference_data.airframes
