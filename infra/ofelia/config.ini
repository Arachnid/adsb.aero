[job-exec "import-traces"]
schedule    = @every 12h
container   = infra-api-1
no-overlap  = true
command     = python -m adsb_server.ingestion.ingest

[job-exec "import-airframes"]
schedule    = 0 0 3 * * 0
container   = infra-api-1
no-overlap  = true
command     = python -m adsb_server.reference_data.airframes
