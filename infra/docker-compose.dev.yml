# Dev overrides — used alongside docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Or simply: make dev

services:
  api:
    # Hot-reload: uvicorn watches for source changes
    command: ["uvicorn", "adsb_server.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../server/adsb_server:/app/adsb_server

  vite:
    image: node:22-alpine
    working_dir: /app
    # pnpm install is fast on subsequent starts because node_modules lives in a named volume
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    restart: unless-stopped
    volumes:
      - ../web:/app
      - vite_node_modules:/app/node_modules
    expose:
      - "5173"

  scheduler:
    environment:
      SCHEDULER_LOOKBACK_DAYS: "7"
      SCHEDULER_KEEP_TRACES: "true"
    volumes:
      - dev_scheduler_cache:/data/cache

  nginx:
    # Dev config: proxy everything non-API to the Vite dev server
    # This volume mount appends after the prod.conf mount; Docker uses the last mount
    # for duplicate destinations, so dev.conf shadows prod.conf at runtime.
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - vite

volumes:
  vite_node_modules:
  dev_scheduler_cache:
