# Dev overrides — used alongside docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Or simply: make dev

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    # Hot-reload: uvicorn watches for source changes
    command: ["uvicorn", "adsb_server.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../server/adsb_server:/app/adsb_server

  vite:
    image: node:22-alpine
    working_dir: /app
    # pnpm install is fast on subsequent starts because node_modules lives in a named volume
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    restart: unless-stopped
    volumes:
      - ../web:/app
      - vite_node_modules:/app/node_modules
    expose:
      - "5173"

  nginx:
    # dev.conf.template shadows prod.conf.template at the same destination path;
    # Docker uses the last mount for duplicate destinations.
    volumes:
      - ./nginx/dev.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - vite

  ofelia:
    profiles: ["tools"]  # disabled in dev — scheduling not needed; use make import-traces

  # One-shot import services for manual dev use (not started by `docker compose up`).
  # Run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm import-traces
  import-traces:
    image: ghcr.io/arachnid/adsb.aero/api:latest
    profiles: ["tools"]
    command: ["python", "-m", "adsb_server.ingestion.ingest"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-adsb}
      POSTGRES_USER: ${POSTGRES_USER:-adsb}
      SCHEDULER_CACHE_DIR: /data/cache
      SCHEDULER_LOOKBACK_DAYS: "80"
      SCHEDULER_KEEP_TRACES: "true"
      HERBIE_KEEP_CACHE: "true"
    secrets:
      - sentry_dsn
    volumes:
      - dev_scheduler_cache:/data/cache
    networks:
      - db
    depends_on:
      postgres:
        condition: service_healthy

  import-airframes:
    image: ghcr.io/arachnid/adsb.aero/api:latest
    profiles: ["tools"]
    command: ["python", "-m", "adsb_server.reference_data.airframes"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-adsb}
      POSTGRES_USER: ${POSTGRES_USER:-adsb}
    secrets:
      - sentry_dsn
    networks:
      - db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vite_node_modules:
  dev_scheduler_cache:
