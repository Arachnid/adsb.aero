services:
  postgres:
    build: ./postgres
    image: adsb-postgres:latest
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adsb}
      POSTGRES_USER: ${POSTGRES_USER:-adsb}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-adsb} -d $${POSTGRES_DB:-adsb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    secrets:
      - grafana_password
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  api:
    build:
      context: ../server
    image: adsb-api:latest
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-adsb}
      POSTGRES_USER: ${POSTGRES_USER:-adsb}
      LOG_QUERIES: ${LOG_QUERIES:-false}
    networks:
      - default
      - db
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    entrypoint: ["/etc/nginx/entrypoint.sh"]
    command: ["/docker-entrypoint.sh", "nginx", "-g", "daemon off;"]
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ../web/dist:/srv/web:ro
      - openaip_cache:/var/cache/nginx/openaip
    ports:
      - "127.0.0.1:80:80"
    secrets:
      - openaip_api_key
    depends_on:
      - api

  scheduler:
    build:
      context: ../server
    restart: unless-stopped
    command: ["python", "-m", "adsb_server.ingestion.scheduler_main"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-adsb}
      POSTGRES_USER: ${POSTGRES_USER:-adsb}
      SCHEDULER_CACHE_DIR: /data/cache
      SCHEDULER_INTERVAL_SECONDS: "43200"
      SCHEDULER_LOOKBACK_DAYS: "0"
      SCHEDULER_KEEP_TRACES: "false"
    volumes:
      - scheduler_cache:/data/cache
    networks:
      - db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  scheduler_cache:
  openaip_cache:

secrets:
  grafana_password:
    file: ./secrets/grafana_password
  openaip_api_key:
    file: ./secrets/openaip_api_key

networks:
  db:
