name: infra

services:
  postgres:
    build: ./postgres
    image: adsb-postgres:latest
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adsb}
      POSTGRES_USER: ${POSTGRES_USER:-adsb}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-adsb} -d $${POSTGRES_DB:-adsb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../server
    image: adsb-api:latest
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-adsb}
      POSTGRES_USER: ${POSTGRES_USER:-adsb}
      LOG_QUERIES: ${LOG_QUERIES:-false}
    secrets:
      - sentry_dsn
    volumes:
      - scheduler_cache:/data/cache
    networks:
      - default
      - db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    entrypoint: ["/etc/nginx/entrypoint.sh"]
    command: ["/docker-entrypoint.sh", "nginx", "-g", "daemon off;"]
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ../web/dist:/srv/web:ro
      - openaip_cache:/var/cache/nginx/openaip
    ports:
      - "80:80"
      - "443:443"
    secrets:
      - openaip_api_key
      - origin_cert
      - origin_key
    depends_on:
      - api

  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --config=/etc/ofelia/config.ini
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ofelia/config.ini:/etc/ofelia/config.ini:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  scheduler_cache:
  openaip_cache:

secrets:
  sentry_dsn:
    file: ./secrets/sentry_dsn
  openaip_api_key:
    file: ./secrets/openaip_api_key
  origin_cert:
    file: ./secrets/origin.crt
  origin_key:
    file: ./secrets/origin.key

networks:
  db:
    # Not marked internal: job containers need outbound internet access to download
    # traces from GitHub. Postgres is secured by the absence of port mappings.
