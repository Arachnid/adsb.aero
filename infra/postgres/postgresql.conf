# PostgreSQL 17 — tuned for OVH EPYC 4244P, 64GB RAM, NVMe RAID 5

# Memory
shared_buffers = 16GB
effective_cache_size = 48GB
work_mem = 256MB
maintenance_work_mem = 2GB
huge_pages = try

# Checkpoints
checkpoint_completion_target = 0.9
wal_buffers = 64MB
min_wal_size = 1GB
max_wal_size = 8GB

# NVMe I/O tuning
random_page_cost = 1.1
effective_io_concurrency = 256
maintenance_io_concurrency = 256

# Parallelism (EPYC 4244P has 6 cores / 12 threads)
max_worker_processes = 12
max_parallel_workers_per_gather = 4
max_parallel_workers = 12
max_parallel_maintenance_workers = 4

# Planner
default_statistics_target = 500
jit = on

# Connections
listen_addresses = '*'
max_connections = 100

# Logging
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB

# pg_partman background worker — creates new monthly partitions automatically
shared_preload_libraries = 'pg_partman_bgw'
pg_partman_bgw.interval = 3600
pg_partman_bgw.role = 'adsb'
pg_partman_bgw.dbname = 'adsb'
