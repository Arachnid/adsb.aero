[project]
name = "adsb-server"
version = "0.1.0"
description = "ADS-B historical query platform — server (ingestion + API)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "scalar-fastapi>=1.8",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pyproj>=3.6",
    "shapely>=2.0",
    "numpy>=2.1",
    "xarray>=2024.1",
    "scipy>=1.14",
    "cfgrib>=0.9.14",
    "herbie-data>=2025.3",
    "h3>=4.1",
    "orjson>=3.10",
    "sentry-sdk[fastapi]>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adsb_server"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = ["N999"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.14"
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "dramatiq.*", "pyproj.*", "sentry_sdk", "sentry_sdk.*", "shapely.*", "testcontainers.*", "alembic.*", "cfgrib.*", "h3", "h3.*", "numpy", "numpy.*", "scipy", "scipy.*", "xarray", "xarray.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# herbie-data doesn't mark its public API with __all__; allow implicit re-exports.
module = ["herbie", "herbie.*"]
ignore_missing_imports = true
no_implicit_reexport = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=adsb_server --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["adsb_server"]
omit = ["tests/*", "adsb_server/reference_data/*"]
